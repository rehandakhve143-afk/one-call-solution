# Isolated local/CI Supabase project only. Never link this to production.
project_id = "ocs-isolated-tests"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = false

[inbucket]
enabled = false
port = 54324

# CI only needs Postgres and migration dependencies; skip optional services.
[analytics]
enabled = false
[realtime]
enabled = false
[storage]
enabled = false
