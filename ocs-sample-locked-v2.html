<script>
const rates=[['Electrician Visit / Inspection',249],['Fan Fitting / Capacitor Change',239],['Fan Hook / Anchor Fastener Fitting',300],['Fan + Anchor Fastener Fitting',450],['Regulator Fitting – Concealed',239],['Regulator Fitting – Normal',239],['Switch Change – 1 No.',239],['1 Switch + 1 Socket Change',250],['Geyser Fitting – Normal',300],['Geyser + Angle Cock',350],['15/16 Amp Board Fitting',239],['Tube/LED Light Fitting',239],['Holder Fitting',239],['Electric Board Change',300],['Bulb Fitting',239],['MCB Tripping / Electrical Fault Diagnosis',400],['Short Circuit / Fault Finding',400],['Main Distribution Board Work',0],['Full House Rewiring',0],['Any Other Electrical Work',0]];
const sel={};const bolt="<svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M13 2 3 14h8l-1 8 10-12h-8l1-8Z\"/></svg>";
function showPage(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');document.getElementById('cart').classList.toggle('on',id==='electrical'&&Object.keys(sel).length>0);window.scrollTo(0,0);if(id==='electrical')renderSvc()}
function openCat(name){if(name==='Electrical')showPage('electrical');else alert(name+' screen follows the same locked layout.')}
function filterCats(){let q=(document.getElementById('catSearch').value||'').toLowerCase();document.querySelectorAll('.cat').forEach(x=>x.style.display=!q||x.dataset.name.includes(q)?'flex':'none')}
function renderSvc(){let q=(document.getElementById('svcSearch')?.value||'').toLowerCase();document.getElementById('svclist').innerHTML=rates.map((r,i)=>{if(q&&!r[0].toLowerCase().includes(q))return '';let n=sel[i]||0,quote=r[1]===0;return '<div class="svc"><div class="thumb">'+bolt+'</div><div class="copy"><b>'+r[0]+'</b><span>'+(quote?'Get Quote':'₹'+r[1])+'</span><small>'+(quote?'Quote after inspection':'Labour charge')+'</small></div>'+(quote?'<button class="add">Get Quote</button>':n?'<div class="step"><button onclick="qty('+i+',-1)">−</button><b>'+n+'</b><button onclick="qty('+i+',1)">+</button></div>':'<button class="add" onclick="qty('+i+',1)">Add</button>')+'</div>'}).join('');updateCart()}
function qty(i,d){sel[i]=Math.max(0,(sel[i]||0)+d);if(!sel[i])delete sel[i];renderSvc()}
function updateCart(){let ids=Object.keys(sel),cart=document.getElementById('cart');if(!ids.length){cart.classList.remove('on');return}let count=ids.reduce((a,k)=>a+sel[k],0),total=ids.reduce((a,k)=>a+rates[k][1]*sel[k],0);document.getElementById('cartText').textContent=count+' Services Selected';document.getElementById('cartTotal').textContent='₹'+total;cart.classList.add('on')}
</script>
</body>
</html>
