name: OCS Isolated Database Validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'tests/**'
      - 'home-services.html'
      - 'ocs-test-mode.html'
      - 'customer-launch-v1.html'
      - 'driver-provider.html'
      - 'transport-driver.html'
      - '.github/workflows/ocs-isolated-db.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - 'tests/**'
      - 'ocs-test-mode.html'
      - 'customer-launch-v1.html'
      - 'home-services.html'
      - 'driver-provider.html'
      - 'transport-driver.html'
      - '.github/workflows/ocs-isolated-db.yml'
permissions:
  contents: read
jobs:
  booking-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run mock booking smoke tests (no live database or payments)
        run: node tests/booking-smoke.cjs
  comprehensive-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser regression dependencies
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Run core OCS regression suite (mock/local only; no live payments)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ocs-regression-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/ocs-test-mode.html >/dev/null; then break; fi
            sleep 1
          done
          for test in \
            tests/smoke.cjs \
            tests/core-focus-smoke.cjs \
            tests/direct-payment-regression.cjs \
            tests/otp-security-regression.cjs \
            tests/wallet-option-b-regression.cjs \
            tests/driver-packages-browser.cjs \
            tests/sp-wallet-bank-browser.cjs \
            tests/sp-work-control-browser.cjs \
            tests/sp-inbox-signals-browser.cjs \
            tests/dashboard-role-preference-smoke.cjs \
            tests/reward-settlement-contract.test.cjs \
            tests/admin-subsidy-contract.test.cjs \
            tests/mobile-browser-smoke.cjs \
            tests/official-export-browser.cjs \
            tests/push-optin-smoke.cjs; do
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
          done
  isolated-database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_ACCESS_TOKEN: ''
      SUPABASE_DB_PASSWORD: ''
      SUPABASE_PROJECT_ID: ''
    steps:
      - uses: actions/checkout@v4
      - name: Reject production credentials and endpoints
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${SUPABASE_ACCESS_TOKEN}" || -n "${SUPABASE_DB_PASSWORD}" || -n "${SUPABASE_PROJECT_ID}" ]]; then
            echo "::error::Production Supabase credentials are forbidden in isolated tests"
            exit 1
          fi
          if grep -R -n -E 'uipmkrsggpkupgbgoxkg|https://[^[:space:]]+\.supabase\.co' supabase/config.toml 2>/dev/null; then
            echo "::error::Production endpoint found in local Supabase config"
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: 2.54.11
      - name: Verify baseline schema exists before isolated migration tests
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -R -l -i -E 'create[[:space:]]+table[[:space:]]+(if[[:space:]]+not[[:space:]]+exists[[:space:]]+)?(public\.)?profiles([[:space:]]|\()' supabase/migrations --include='*.sql' | grep -q .; then
            echo '::error::Missing baseline schema: migrations alter public.profiles but do not create it. Add an initial schema migration before running isolated database tests.'
            exit 1
          fi
      - name: Normalize legacy date-only migration versions in isolated checkout
        shell: bash
        run: |
          set -euo pipefail
          # Historical repository files use YYYYMMDD instead of the 14-digit
          # versions required by Supabase. Rename only the ephemeral CI copy;
          # never repair or change the production migration history.
          n=0
          while IFS= read -r file; do
            n=$((n + 1))
            base="${file##*/}"
            day="${base%%_*}"
            suffix="${base#*_}"
            printf -v version '%s%06d' "$day" "$n"
            mv -- "$file" "supabase/migrations/${version}_${suffix}"
          done < <(find supabase/migrations -maxdepth 1 -type f -regextype posix-extended -regex '.*/[0-9]{8}_[^/]+[.]sql' | sort)
          if find supabase/migrations -maxdepth 1 -type f -regextype posix-extended -regex '.*/[0-9]{8}_[^/]+[.]sql' | grep -q .; then
            echo '::error::Date-only migration version remains'
            exit 1
          fi
      - name: Check baseline dependencies before starting isolated database
        shell: bash
        run: |
          set -euo pipefail
          # A single historical migration is not a complete production baseline.
          # Fail with an actionable message before downloading Docker images.
          if ! grep -R -l -i -F 'CREATE TABLE IF NOT EXISTS public.ocs_provider_subsidy_disbursements' supabase/migrations --include='*.sql' | grep -q .; then
            echo '::error::Incomplete isolated baseline: missing CREATE TABLE public.ocs_provider_subsidy_disbursements, required by ocs_admin_mark_provider_subsidy_sent_v1. Recover the complete schema before running migrations.'
            exit 1
          fi
      - name: Authenticate Docker Hub for isolated CI when credentials are configured
        shell: bash
        env:
          OCS_DOCKERHUB_USERNAME: ${{ secrets.OCS_DOCKERHUB_USERNAME }}
          OCS_DOCKERHUB_TOKEN: ${{ secrets.OCS_DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "$OCS_DOCKERHUB_USERNAME" && -n "$OCS_DOCKERHUB_TOKEN" ]]; then
            printf '%s' "$OCS_DOCKERHUB_TOKEN" | docker login --username "$OCS_DOCKERHUB_USERNAME" --password-stdin
            echo "::notice::Authenticated Docker Hub pull enabled for isolated database test"
          elif [[ -z "$OCS_DOCKERHUB_USERNAME" && -z "$OCS_DOCKERHUB_TOKEN" ]]; then
            echo "::warning::Anonymous Docker Hub pulls can be rate limited. Set both OCS_DOCKERHUB_USERNAME and OCS_DOCKERHUB_TOKEN repository secrets to enable authenticated image pulls."
          else
            echo "::error::Both OCS_DOCKERHUB_USERNAME and OCS_DOCKERHUB_TOKEN secrets are required together"
            exit 1
          fi
      - name: Start isolated Supabase stack
        shell: bash
        run: |
          set -euo pipefail
          # Registry throttling is transient. Retry only that failure, with bounded backoff.
          # Never hide SQL, config, or other startup errors behind retries.
          started=false
          for attempt in 1 2 3; do
            if supabase start --debug -x studio,inbucket,storage-api,imgproxy,logflare,vector,edge-runtime,realtime > /tmp/ocs-supabase-start.log 2>&1; then
              started=true
              break
            fi
            if grep -Eiq 'toomanyrequests|429 Too Many Requests|rate limit exceeded|retry-after:.*allowed:' /tmp/ocs-supabase-start.log && [[ "$attempt" -lt 3 ]]; then
              echo "::warning::Docker registry rate limit during isolated Supabase startup; retry $attempt/2 after backoff"
              sleep $((attempt * 30))
            else
              break
            fi
          done
          if [[ "$started" != true ]]; then
            echo "::error::Isolated Supabase stack failed to start (production untouched)"
            echo "::group::Supabase start error details"
            tail -n 160 /tmp/ocs-supabase-start.log || true
            echo "::endgroup::"
            echo "::group::Docker container status"
            docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' || true
            echo "::endgroup::"
            exit 1
          fi
          tail -n 30 /tmp/ocs-supabase-start.log
      - name: Verify isolated endpoint
        shell: bash
        run: |
          set -euo pipefail
          supabase status
          local_url="$(supabase status -o env | sed -n 's/^API_URL=//p' | tr -d '"')"
          if [[ "$local_url" != http://127.0.0.1:54321 && "$local_url" != http://localhost:54321 ]]; then
            echo "::error::Refusing tests against nonlocal Supabase: $local_url"
            exit 1
          fi
      - name: Apply repository migrations in isolated database
        run: supabase db reset --local --yes
      - name: Verify four-digit Start OTP in isolated database
        shell: bash
        run: |
          set -euo pipefail
          query="SELECT CASE WHEN pg_get_functiondef(p.oid) LIKE '%floor(random()*9000)+1000%' AND pg_get_functiondef(p.oid) NOT LIKE '%floor(random()*900000)+100000%' THEN 'PASS' ELSE 'FAIL' END FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='public' AND p.proname='provider_booking_action';"
          result="$(docker exec supabase_db_ocs-isolated-tests psql -U postgres -d postgres -v ON_ERROR_STOP=1 -tAc "$query")"
          if [[ "$result" != "PASS" ]]; then
            echo "::error::Backend Start OTP is not four digits after migrations (result: $result)"
            exit 1
          fi
          echo "::notice::Isolated backend Start OTP generator is four digits; live production remains separate"
      - name: Audit wallet hold separation in isolated schema
        shell: bash
        run: |
          set -euo pipefail
          # Audit schema only; no user data or wallet balance is modified.
          query="SELECT coalesce(string_agg(column_name, ',' ORDER BY column_name),'') FROM information_schema.columns WHERE table_schema='public' AND table_name='provider_status' AND column_name IN ('wallet_hold','available_for_work','admin_paused');"
          cols="$(docker exec supabase_db_ocs-isolated-tests psql -U postgres -d postgres -v ON_ERROR_STOP=1 -tAc "$query")"
          echo "provider_status control columns: $cols"
          [[ ",$cols," == *",available_for_work,"* ]] || { echo "::error::Missing provider work toggle"; exit 1; }
          [[ ",$cols," == *",admin_paused,"* ]] || { echo "::error::Missing provider admin hold"; exit 1; }
          if [[ ",$cols," != *",wallet_hold,"* ]]; then
            # Current OCS schema represents wallet hold using admin_paused +
            # admin_pause_reason='wallet', not a dedicated wallet_hold column.
            # Do not misreport this intentional implementation as a missing migration.
            reason_col="$(docker exec supabase_db_ocs-isolated-tests psql -U postgres -d postgres -v ON_ERROR_STOP=1 -tAc "SELECT count(*) FROM information_schema.columns WHERE table_schema='public' AND table_name='provider_status' AND column_name='admin_pause_reason'")"
            [[ "$reason_col" == "1" ]] || { echo "::error::Wallet hold has neither wallet_hold nor admin_pause_reason"; exit 1; }
            echo "::notice::Wallet hold uses admin_paused + admin_pause_reason; behavior still requires tests"
          else
            echo "::notice::Dedicated wallet_hold column exists; behavior still requires tests."
          fi
      - name: Run database pgTAP tests if present
        shell: bash
        run: |
          set -euo pipefail
          if find supabase/tests -type f -name '*.sql' -print -quit 2>/dev/null | grep -q .; then
            supabase test db
          else
            echo "::notice::No pgTAP tests yet; migrations-only validation, NOT an E2E PASS"
          fi
      - name: Stop isolated stack
        if: always()
        run: supabase stop --no-backup || true

  demo-mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Run customer-SP simulated mobile booking through payment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ocs-demo-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/ocs-test-mode.html >/dev/null; then break; fi
            sleep 1
          done
          node tests/demo-e2e-browser.cjs
