name: OCS Isolated Database Validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'tests/**'
      - 'home-services.html'
      - '.github/workflows/ocs-isolated-db.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - 'tests/**'
      - 'home-services.html'
      - '.github/workflows/ocs-isolated-db.yml'
permissions:
  contents: read
jobs:
  booking-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run mock booking smoke tests (no live database or payments)
        run: node tests/booking-smoke.cjs
  isolated-database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_ACCESS_TOKEN: ''
      SUPABASE_DB_PASSWORD: ''
      SUPABASE_PROJECT_ID: ''
    steps:
      - uses: actions/checkout@v4
      - name: Reject production credentials and endpoints
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${SUPABASE_ACCESS_TOKEN}" || -n "${SUPABASE_DB_PASSWORD}" || -n "${SUPABASE_PROJECT_ID}" ]]; then
            echo "::error::Production Supabase credentials are forbidden in isolated tests"
            exit 1
          fi
          if grep -R -n -E 'uipmkrsggpkupgbgoxkg|https://[^[:space:]]+\.supabase\.co' supabase/config.toml 2>/dev/null; then
            echo "::error::Production endpoint found in local Supabase config"
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: 2.54.11
      - name: Verify baseline schema exists before isolated migration tests
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -R -l -i -E 'create[[:space:]]+table[[:space:]]+(if[[:space:]]+not[[:space:]]+exists[[:space:]]+)?(public\.)?profiles([[:space:]]|\()' supabase/migrations --include='*.sql' | grep -q .; then
            echo '::error::Missing baseline schema: migrations alter public.profiles but do not create it. Add an initial schema migration before running isolated database tests.'
            exit 1
          fi
      - name: Normalize legacy date-only migration versions in isolated checkout
        shell: bash
        run: |
          set -euo pipefail
          # Historical repository files use YYYYMMDD instead of the 14-digit
          # versions required by Supabase. Rename only the ephemeral CI copy;
          # never repair or change the production migration history.
          n=0
          while IFS= read -r file; do
            n=$((n + 1))
            base="${file##*/}"
            day="${base%%_*}"
            suffix="${base#*_}"
            printf -v version '%s%06d' "$day" "$n"
            mv -- "$file" "supabase/migrations/${version}_${suffix}"
          done < <(find supabase/migrations -maxdepth 1 -type f -regextype posix-extended -regex '.*/[0-9]{8}_[^/]+[.]sql' | sort)
          if find supabase/migrations -maxdepth 1 -type f -regextype posix-extended -regex '.*/[0-9]{8}_[^/]+[.]sql' | grep -q .; then
            echo '::error::Date-only migration version remains'
            exit 1
          fi
      - name: Check baseline dependencies before starting isolated database
        shell: bash
        run: |
          set -euo pipefail
          # A single historical migration is not a complete production baseline.
          # Fail with an actionable message before downloading Docker images.
          if ! grep -R -l -i -F 'CREATE TABLE IF NOT EXISTS public.ocs_provider_subsidy_disbursements' supabase/migrations --include='*.sql' | grep -q .; then
            echo '::error::Incomplete isolated baseline: missing CREATE TABLE public.ocs_provider_subsidy_disbursements, required by ocs_admin_mark_provider_subsidy_sent_v1. Recover the complete schema before running migrations.'
            exit 1
          fi
      - name: Start isolated Supabase stack
        run: supabase start
      - name: Verify isolated endpoint
        shell: bash
        run: |
          set -euo pipefail
          supabase status
          local_url="$(supabase status -o env | sed -n 's/^API_URL=//p' | tr -d '"')"
          if [[ "$local_url" != http://127.0.0.1:54321 && "$local_url" != http://localhost:54321 ]]; then
            echo "::error::Refusing tests against nonlocal Supabase: $local_url"
            exit 1
          fi
      - name: Apply repository migrations in isolated database
        run: supabase db reset --local --yes
      - name: Run database pgTAP tests if present
        shell: bash
        run: |
          set -euo pipefail
          if find supabase/tests -type f -name '*.sql' -print -quit 2>/dev/null | grep -q .; then
            supabase test db
          else
            echo "::notice::No pgTAP tests yet; migrations-only validation, NOT an E2E PASS"
          fi
      - name: Stop isolated stack
        if: always()
        run: supabase stop --no-backup || true

  demo-mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Run customer-SP simulated mobile booking through payment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ocs-demo-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/ocs-test-mode.html >/dev/null; then break; fi
            sleep 1
          done
          node tests/demo-e2e-browser.cjs
