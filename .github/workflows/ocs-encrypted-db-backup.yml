name: OCS Encrypted Production Database Backup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  encrypted-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OCS_BACKUP_DATABASE_URL: ${{ secrets.OCS_BACKUP_DATABASE_URL }}
      OCS_BACKUP_PASSPHRASE: ${{ secrets.OCS_BACKUP_PASSPHRASE }}
    steps:
      - name: Require private backup configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$OCS_BACKUP_DATABASE_URL" || -z "$OCS_BACKUP_PASSPHRASE" ]]; then
            echo "::error::Configure OCS_BACKUP_DATABASE_URL and OCS_BACKUP_PASSPHRASE as repository Actions secrets before running this backup."
            exit 1
          fi
          # Reject an unedited template without printing the credential.
          if [[ "$OCS_BACKUP_DATABASE_URL" == *'[YOUR-PASSWORD]'* || "$OCS_BACKUP_DATABASE_URL" == *'%5BYOUR-PASSWORD%5D'* ]]; then
            echo "::error::Database URL still contains the YOUR-PASSWORD placeholder. Set the real database password in the GitHub Actions secret (never paste it in logs)."
            exit 1
          fi
          if [[ "$OCS_BACKUP_DATABASE_URL" != postgresql://* && "$OCS_BACKUP_DATABASE_URL" != postgres://* ]]; then
            echo "::error::Database URL must begin with postgresql:// or postgres://."
            exit 1
          fi
          if [[ ${#OCS_BACKUP_PASSPHRASE} -lt 20 ]]; then
            echo "::error::Backup passphrase must contain at least 20 characters."
            exit 1
          fi
      - name: Verify PostgreSQL client version
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm postgres:17 pg_dump --version
          docker run --rm postgres:17 pg_restore --version

      - name: Validate database connection and server compatibility
        shell: bash
        run: |
          set -euo pipefail
          # A real SQL query distinguishes a working connection from a dump failure.
          # Never print the connection string or raw database error text.
          err="$RUNNER_TEMP/ocs-preflight.stderr"
          trap 'rm -f "$err"' EXIT
          if ! result="$(docker run --rm --network host \
            -e OCS_BACKUP_DATABASE_URL -e PGCONNECT_TIMEOUT=15 \
            postgres:17 sh -c 'exec psql "$OCS_BACKUP_DATABASE_URL" -X -A -t -q -v ON_ERROR_STOP=1 -c "SHOW server_version_num"' \
            2>"$err")"; then
            if grep -Eqi 'password authentication failed|authentication failed|tenant or user not found|FATAL:.*role' "$err"; then
              echo "::error::Preflight FAIL: authentication or pooler credentials rejected."
            elif grep -Eqi 'could not translate|connection refused|timeout|timed out|network|could not connect|SSL' "$err"; then
              echo "::error::Preflight FAIL: network, host, port or TLS connection."
            else
              echo "::error::Preflight FAIL: database SQL connection rejected (private details withheld)."
            fi
            exit 1
          fi
          if [[ ! "$result" =~ ^[0-9]{5,6}$ ]]; then
            echo "::error::Preflight FAIL: server version query returned unexpected output."
            exit 1
          fi
          server_major=$((result / 10000))
          echo "Database SQL connection PASS; PostgreSQL server major: $server_major"
          if (( server_major > 17 )); then
            echo "::error::PostgreSQL 17 pg_dump cannot export a newer server major version."
            exit 1
          fi
      - name: Create encrypted PostgreSQL 17 backup (no plaintext artifact)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export PGCONNECT_TIMEOUT=15
          # Supabase may enforce a short per-statement timeout (currently 2min).
          # Override only for this backup connection; never change DB defaults.
          export PGOPTIONS="-c statement_timeout=0"
          mkdir -p "$RUNNER_TEMP/ocs-backup"
          echo "Starting PostgreSQL 17 encrypted export (credentials hidden)."
          # Expand the secret only inside the container, not in the host's
          # docker command arguments (which may be visible in process listings).
          # Capture pg_dump diagnostics privately; do not expose connection credentials.
          error_file="$RUNNER_TEMP/ocs-backup/pg_dump.stderr"
          trap 'rm -f "$error_file"' EXIT
          if ! (docker run --rm --network host -e OCS_BACKUP_DATABASE_URL -e PGCONNECT_TIMEOUT -e PGOPTIONS \
            postgres:17 sh -c 'exec pg_dump --verbose --dbname="$OCS_BACKUP_DATABASE_URL" --format=custom --no-owner --no-acl --file=/dev/stdout' \
            2>"$error_file" \
            | openssl enc -aes-256-cbc -pbkdf2 -salt -iter 200000 \
                -pass env:OCS_BACKUP_PASSPHRASE \
                -out "$RUNNER_TEMP/ocs-backup/ocs-production.dump.enc"); then
            rm -f "$RUNNER_TEMP/ocs-backup/ocs-production.dump.enc"
            # Emit metadata only: stderr is private and may contain credentials.
            # Verbose pg_dump helps distinguish connection, schema and table-data stages.
            if grep -Eqi 'dumping contents of table|dumping data for table' "$error_file"; then
              echo "::error::Export stage: table data (connection succeeded)."
            elif grep -Eqi 'reading schemas|reading user-defined|reading extensions|reading tables|reading indexes|reading triggers|saving database definition' "$error_file"; then
              echo "::error::Export stage: schema/metadata (connection succeeded)."
            else
              echo "::error::Export stage: connection/startup or unknown."
            fi
            if grep -Eqi 'canceling statement due to statement timeout|statement timeout|statement_timeout' "$error_file"; then
              echo "::error::Cause: PostgreSQL statement timeout."
            elif grep -Eqi 'terminating connection due to idle|idle.*timeout|pooler.*timeout' "$error_file"; then
              echo "::error::Cause: pooler or idle session timeout."
            elif grep -Eqi 'server closed the connection unexpectedly|unexpected EOF|SSL SYSCALL error|connection terminated|connection lost|broken pipe' "$error_file"; then
              echo "::error::Cause: connection dropped during export."
            elif grep -Eqi 'permission denied for (table|schema|sequence)|must be owner of|permission denied to' "$error_file"; then
              echo "::error::Cause: insufficient database export privileges."
            elif grep -Eqi 'server version:|server version mismatch|aborting because of server version mismatch' "$error_file"; then
              echo "::error::Cause: PostgreSQL server/client version mismatch."
            elif grep -Eqi 'invalid byte sequence|invalid input syntax|out of memory|no space left on device|disk full' "$error_file"; then
              echo "::error::Cause: export data, memory or disk issue."
            fi
            # Safe pg_dump error categorization: print no raw SQL, table names, or credentials.
            # PostgreSQL may report a failed COPY/table export using wording that
            # does not match the generic pg_dump error patterns above.
            if grep -Eqi 'COPY .* TO stdout failed|error while copying table|dumping the contents of table .* failed|pg_dump: error: Dumping the contents of table' "$error_file"; then
              echo "::error::Diagnostic stage: table COPY/data export failed."
            fi
            if grep -Eqi 'pg_dump: error: query failed: ERROR:|pg_dump: error: query was:|ERROR: ' "$error_file"; then
              echo "::error::Diagnostic class: PostgreSQL returned a SQL error during export."
            fi
            if grep -Eqi 'statement timeout|canceling statement|57014' "$error_file"; then
              echo "::error::Diagnostic class: SQL query canceled or timed out."
            elif grep -Eqi 'out of shared memory|53200|resource temporarily unavailable|too many connections|53300' "$error_file"; then
              echo "::error::Diagnostic class: database resource limit."
            elif grep -Eqi 'permission denied|42501|row-level security|RLS' "$error_file"; then
              echo "::error::Diagnostic class: access policy or privilege restriction."
            elif grep -Eqi 'invalid input syntax|22P02|invalid byte sequence|22021' "$error_file"; then
              echo "::error::Diagnostic class: data encoding or format."
            elif grep -Eqi 'could not read|could not write|broken pipe|unexpected EOF|08006|08003' "$error_file"; then
              echo "::error::Diagnostic class: stream or connection interrupted."
            fi
            # Report a nonreversible fingerprint for comparing repeated failures.
            echo "::notice::Diagnostic fingerprint: $(sha256sum "$error_file" | cut -c1-12); stderr bytes: $(wc -c < "$error_file" | tr -d ' ')"
            # Report only fixed diagnostic labels, never raw stderr or connection strings.
            # A broad fallback distinguishes container/connection/export errors.
            if [[ ! -s "$error_file" ]]; then
              echo "::error::Diagnostic: pg_dump produced no stderr. Inspect Docker/container execution and runner termination."
            elif grep -Eqi 'timeout|timed out|deadline exceeded|i/o timeout' "$error_file"; then
              echo "::error::Diagnostic: timeout detected during PostgreSQL export."
            elif grep -Eqi 'FATAL:|authentication|password|role .* does not exist|tenant or user not found' "$error_file"; then
              echo "::error::Diagnostic: database authentication or pooler user/tenant rejection."
            elif grep -Eqi 'pg_dump: error: query failed|pg_dump: error: query was|permission denied|must be owner' "$error_file"; then
              echo "::error::Diagnostic: PostgreSQL rejected an export query or permission."
            elif grep -Eqi 'pg_dump: error: connection|could not connect|connection .*failed|could not translate|network is unreachable|connection reset|connection refused|server closed|SSL|certificate' "$error_file"; then
              echo "::error::Diagnostic: PostgreSQL connection, network or TLS failure."
            elif grep -Eqi 'docker:|Cannot connect to the Docker daemon|Unable to find image|pull access denied|OCI runtime|exec format error' "$error_file"; then
              echo "::error::Diagnostic: Docker image/container execution failure."
            elif grep -Eqi 'pg_dump: error:|pg_dump: fatal:' "$error_file"; then
              echo "::error::Diagnostic: pg_dump reported an export error not covered by the known categories."
            else
              echo "::error::Diagnostic: export pipeline failed with an unrecognized stderr category."
            fi
            if grep -qi 'password authentication failed' "$error_file"; then
              echo "::error::Supabase rejected the database password. Update GitHub Actions secret OCS_BACKUP_DATABASE_URL with a valid Session pooler connection string and URL-encoded password. Do not reset the production database password or share it in logs."
            elif grep -qi 'could not translate host name\|connection timed out\|connection refused' "$error_file"; then
              echo "::error::Database host/network connection failed. Verify the host and port in OCS_BACKUP_DATABASE_URL."
            elif grep -Eqi 'permission denied|must be owner|insufficient privilege' "$error_file"; then
              echo "::error::Database export was denied by PostgreSQL permissions. Check backup role privileges without sharing credentials."
            elif grep -Eqi 'server version mismatch|aborting because of server version mismatch' "$error_file"; then
              echo "::error::PostgreSQL server/client version mismatch. Check the server major version before selecting a compatible pg_dump image."
            elif grep -Eqi 'no pg_hba.conf entry|SSL off|certificate verify failed|SSL error' "$error_file"; then
              echo "::error::Database TLS or access policy rejected the connection. Check the Supabase pooler SSL settings."
            elif grep -Eqi 'invalid URI query parameter|invalid percent-encoded token|missing "=" after|could not parse|invalid connection option|invalid URI' "$error_file"; then
              echo "::error::Database URL format is invalid. URL-encode reserved password characters and use a valid Session pooler URI."
            elif grep -Eqi 'connection to server.*failed|network is unreachable|could not connect to server|server closed the connection|connection reset by peer' "$error_file"; then
              echo "::error::Database connection failed before export. Check network reachability, pooler availability, and host/port."
            else
              echo "::error::PostgreSQL backup export failed (unclassified). Check the private connection configuration; credentials and raw stderr were deliberately not printed."
            fi
            exit 1
          fi
          rm -f "$error_file"
          test -s "$RUNNER_TEMP/ocs-backup/ocs-production.dump.enc"
          # Verify decryption and the custom archive table of contents without writing plaintext.
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -pass env:OCS_BACKUP_PASSPHRASE \
            -in "$RUNNER_TEMP/ocs-backup/ocs-production.dump.enc" \
            | docker run --rm -i postgres:17 pg_restore --list >/dev/null
          echo "Encrypted backup created and archive structure verified. Full restore remains untested."
      - name: Upload encrypted backup only
        uses: actions/upload-artifact@v4
        with:
          name: ocs-encrypted-db-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/ocs-backup/ocs-production.dump.enc
          retention-days: 7
          if-no-files-found: error
