name: OCS Encrypted Production Database Backup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  encrypted-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OCS_BACKUP_DATABASE_URL: ${{ secrets.OCS_BACKUP_DATABASE_URL }}
      OCS_BACKUP_PASSPHRASE: ${{ secrets.OCS_BACKUP_PASSPHRASE }}
    steps:
      - name: Require private backup configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$OCS_BACKUP_DATABASE_URL" || -z "$OCS_BACKUP_PASSPHRASE" ]]; then
            echo "::error::Configure OCS_BACKUP_DATABASE_URL and OCS_BACKUP_PASSPHRASE as repository Actions secrets before running this backup."
            exit 1
          fi
          # Reject an unedited template without printing the credential.
          if [[ "$OCS_BACKUP_DATABASE_URL" == *'[YOUR-PASSWORD]'* || "$OCS_BACKUP_DATABASE_URL" == *'%5BYOUR-PASSWORD%5D'* ]]; then
            echo "::error::Database URL still contains the YOUR-PASSWORD placeholder. Set the real database password in the GitHub Actions secret (never paste it in logs)."
            exit 1
          fi
          if [[ "$OCS_BACKUP_DATABASE_URL" != postgresql://* && "$OCS_BACKUP_DATABASE_URL" != postgres://* ]]; then
            echo "::error::Database URL must begin with postgresql:// or postgres://."
            exit 1
          fi
          if [[ ${#OCS_BACKUP_PASSPHRASE} -lt 20 ]]; then
            echo "::error::Backup passphrase must contain at least 20 characters."
            exit 1
          fi
      - name: Verify PostgreSQL client version
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm postgres:17 pg_dump --version
          docker run --rm postgres:17 pg_restore --version

      - name: Create encrypted PostgreSQL 17 backup (no plaintext artifact)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export PGCONNECT_TIMEOUT=15
          mkdir -p "$RUNNER_TEMP/ocs-backup"
          echo "Starting PostgreSQL 17 encrypted export (credentials hidden)."\n          # Expand the secret only inside the container, not in the host's
          # docker command arguments (which may be visible in process listings).
          docker run --rm --network host -e OCS_BACKUP_DATABASE_URL -e PGCONNECT_TIMEOUT \
            postgres:17 sh -c 'exec pg_dump --dbname="$OCS_BACKUP_DATABASE_URL" --format=custom --no-owner --no-acl --file=/dev/stdout' \
            | openssl enc -aes-256-cbc -pbkdf2 -salt -iter 200000 \
                -pass env:OCS_BACKUP_PASSPHRASE \
                -out "$RUNNER_TEMP/ocs-backup/ocs-production.dump.enc"
          test -s "$RUNNER_TEMP/ocs-backup/ocs-production.dump.enc"
          # Verify decryption and the custom archive table of contents without writing plaintext.
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -pass env:OCS_BACKUP_PASSPHRASE \
            -in "$RUNNER_TEMP/ocs-backup/ocs-production.dump.enc" \
            | docker run --rm -i postgres:17 pg_restore --list >/dev/null
          echo "Encrypted backup created and archive structure verified. Full restore remains untested."
      - name: Upload encrypted backup only
        uses: actions/upload-artifact@v4
        with:
          name: ocs-encrypted-db-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/ocs-backup/ocs-production.dump.enc
          retention-days: 7
          if-no-files-found: error
