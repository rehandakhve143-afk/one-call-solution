name: Deploy OCS to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node for smoke tests
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify posting, photo rates, draft and enquiry code (no live payments)
        run: node tests/smoke.cjs
      - name: Verify customer/SP booking and Start OTP with mocked backend
        run: node tests/booking-smoke.cjs
      - name: Install mobile browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Open app in mobile Chromium and verify photo prices
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ocs-browser-server.log 2>&1 &
          node tests/mobile-browser-smoke.cjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
