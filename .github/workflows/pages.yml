name: Deploy OCS to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # Finish the active deployment instead of cancelling it when another push arrives.
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node for smoke tests
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify posting, photo rates, draft and enquiry code (no live payments)
        run: node tests/smoke.cjs
      - name: Verify safe push opt-in UI and service worker
        run: node tests/push-optin-smoke.cjs
      - name: Verify customer/SP booking and Start OTP with mocked backend
        run: node tests/booking-smoke.cjs
      - name: Verify provider Start OTP frontend safeguards (static only)
        run: node tests/otp-security-regression.cjs
      - name: Verify direct-to-provider payment guidance and receipt wiring (static only)
        run: node tests/direct-payment-regression.cjs
      - name: Verify booking commission exactly once for SP Driver Transport (static only)
        run: node tests/commission-once-regression.cjs
      - name: Verify Customer SP Driver Transport priorities without live data
        run: node tests/core-focus-smoke.cjs
      - name: Verify wallet Option B migration preserves provider Work ON/OFF (static only)
        run: node tests/wallet-option-b-regression.cjs
      - name: Verify account-scoped dashboard preference and provider role gate (static only)
        run: node tests/dashboard-role-preference-smoke.cjs
      - name: Verify reward settlement arithmetic for SP Driver and Transport (no live payments)
        run: node tests/reward-settlement-contract.test.cjs
      - name: Verify admin subsidy screen and bank safety contracts (no payments)
        run: node tests/admin-subsidy-contract.test.cjs
      - name: Install mobile browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Open app in mobile Chromium and verify photo prices
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ocs-browser-server.log 2>&1 &
          node tests/mobile-browser-smoke.cjs
      - name: Verify complete isolated demo booking in mobile Chromium (no real money)
        run: node tests/demo-e2e-browser.cjs
      - name: Verify Driver package rate controls in mobile Chromium (mocked backend)
        run: |
          node tests/driver-packages-browser.cjs
      - name: Verify official record export in mobile Chromium (mocked admin, no real member data)
        run: |
          node tests/official-export-browser.cjs
      - name: Verify zero-wallet SP Work ON and Admin work controls in mobile Chromium (mocked backend)
        run: |
          node tests/sp-work-control-browser.cjs
      - name: Verify simultaneous SP new job and quote discussion signals in mobile Chromium (mocked backend)
        run: |
          node tests/sp-inbox-signals-browser.cjs
      - name: Verify SP wallet, optional bank setup and Work OFF/ON in mobile Chromium (mocked)
        run: |
          node tests/sp-wallet-bank-browser.cjs
      - name: Verify GitHub Pages base-path compatibility
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const files=['manifest.json','service-worker.js','assets/ocs-home.css'];
          for(const file of files){if(!fs.existsSync(file))throw Error('Missing published asset: '+file);}
          if(!html.includes('manifest.json'))throw Error('Missing manifest reference');
          console.log('Published entry assets exist; browser/network integration still requires live verification');
          NODE
      - name: Verify published Admin Subsidy Review script path (static)
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const expected='js/ocs-admin-subsidy-review.js?v=20261020';
          if(!html.includes(expected)) throw Error('Expected admin subsidy script reference missing');
          if(!fs.existsSync('js/ocs-admin-subsidy-review.js')) throw Error('Referenced JS missing');
          const script=fs.readFileSync('js/ocs-admin-subsidy-review.js','utf8');
          if(!script.includes('ocs_admin_prepare_provider_subsidy_v1')||!script.includes('ocs_admin_mark_provider_subsidy_sent_v1')||!script.includes('ocs_admin_verify_provider_subsidy_v1')) throw Error('Missing prepare/sent/verify subsidy wiring');
          const published=fs.readFileSync('assets/ocs-admin-subsidy-review.js','utf8');
          if(published!==script) throw Error('Admin subsidy JS copies have drifted');
          const workflow=fs.readFileSync('.github/workflows/pages.yml','utf8');
          if(!workflow.includes('cp -- js/ocs-admin-subsidy-review.js')) throw Error('Script not copied into Pages artifact');
          console.log('PASS: Admin subsidy script reference matches Pages copy rule');
          NODE
      - name: Publish mobile-friendly test summary
        if: always()
        run: |
          {
            echo "## OCS automated test and deployment report"
            echo ""
            echo "- Commit: \u0060$GITHUB_SHA\u0060"
            echo "- Automated checks: see the steps above for individual results."
            echo "- These checks use mocks/static contracts and isolated browser demos; they do not verify live customer payments, real bank receipts or production E2E bookings."
            echo "- Release gate: real Customer -> SP -> OTP -> Completion -> direct payment -> 9% wallet ledger -> rating, plus separate Driver/Transport verification."
            echo "- Never interpret a green CI deployment as a live-payment PASS."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      # Keep build scripts, tests, repository history/docs and node_modules
      # out of the publicly published GitHub Pages artifact.
      - name: Prepare public static site only
        run: |
          mkdir -p "$RUNNER_TEMP/ocs-public-site"
          find . -maxdepth 1 -type f \( -name '*.html' -o -name 'manifest.json' -o -name 'app-version.json' -o -name 'service-worker.js' \) -exec cp -- '{}' "$RUNNER_TEMP/ocs-public-site/" \;
          cp -R -- assets "$RUNNER_TEMP/ocs-public-site/assets"
          mkdir -p "$RUNNER_TEMP/ocs-public-site/js"
          cp -- js/ocs-admin-subsidy-review.js "$RUNNER_TEMP/ocs-public-site/js/ocs-admin-subsidy-review.js"
          test -s "$RUNNER_TEMP/ocs-public-site/js/ocs-admin-subsidy-review.js"
          test -s "$RUNNER_TEMP/ocs-public-site/index.html"
          test -s "$RUNNER_TEMP/ocs-public-site/service-worker.js"
          test -f "$RUNNER_TEMP/ocs-public-site/assets/ocs-home.css"
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/ocs-public-site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
