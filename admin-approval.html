<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>OCS Admin Approval</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#f4f6f8;color:#17343c;font-family:Arial,sans-serif}
.app{width:min(480px,100%);margin:0 auto;min-height:100vh;padding-bottom:30px}
.top{background:#063f4a;color:#fff;padding:18px 16px 20px;border-radius:0 0 24px 24px}
.brand{display:flex;align-items:center;gap:11px}.logo{width:46px;height:46px;border-radius:14px;background:#111;display:grid;place-items:center;font-weight:900}
.brand b{display:block;font-size:20px}.brand small{display:block;margin-top:2px;color:#cee2e5;font-size:10px}
.main{padding:14px 16px}.card{background:#fff;border:1px solid #e0e7e9;border-radius:18px;padding:14px;margin-bottom:11px}
.card h2,.card h3{margin:0 0 8px}.muted{font-size:10px;line-height:1.45;color:#7c8d92}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid #edf1f2;font-size:10px}.row:first-of-type{margin-top:9px}.row b{text-align:right}
.badge{display:inline-block;padding:6px 9px;border-radius:999px;background:#fff3d9;color:#94651d;font-size:9px;font-weight:900}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.actions button,.btn{min-height:44px;border:0;border-radius:12px;font-weight:900;font-size:10px}
.ok{background:#07877d;color:#fff}.red{background:#fff0ed;color:#a63a2c;border:1px solid #f0d0c9!important}.btn{width:100%;background:#fff;border:1px solid #d9e3e5;color:#27454d}
.info{padding:10px 12px;border-radius:13px;background:#eef8f6;color:#426166;font-size:9.5px;line-height:1.45;margin-bottom:11px}
.empty{text-align:center;padding:28px 10px}.empty .i{width:62px;height:62px;border-radius:19px;background:#eaf7f3;display:grid;place-items:center;margin:auto;font-size:28px}.empty h3{margin:12px 0 5px}
.error{padding:11px;border-radius:12px;background:#fff0ed;color:#96392d;font-size:10px;line-height:1.45}
.login{padding:26px;text-align:center}.login button{margin-top:12px}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="logo">OCS</div><div><b>Admin • SP Approval</b><small>One Call Solution internal control</small></div></div></header>
<main class="main">
 <div class="info"><b>Only Admin:</b> Pehle private SP verification details check karein, phir Approve/Reject karein. Approval ke baad hi Work ON allowed hai.</div>
 <div id="content"><div class="card">Loading Admin approval queue...</div></div>
 <button class="btn" onclick="loadQueue()">↻ Refresh</button>
</main>
</div>
<script>
const sb=window.supabase.createClient(
 'https://uipmkrsggpkupgbgoxkg.supabase.co',
 'sb_publishable_YmgIixuDsztWjCWcJS5m_g_Zfi6Vjto',
 {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}
);
const box=document.getElementById('content');
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
let adminOtpEmail='';
function renderAdminLogin(){
 box.innerHTML=
 '<div class="card login">'+
   '<h3>Admin login required</h3>'+
   '<div class="muted">OCS Admin email par OTP aayega. Customer/SP login se separate.</div>'+
   '<input id="adminEmail" type="email" autocomplete="email" placeholder="Admin email" style="width:100%;height:46px;margin-top:14px;border:1px solid #d8e2e4;border-radius:12px;padding:0 12px;font:inherit">'+
   '<button id="adminSendOtp" class="ok btn" onclick="sendAdminOtp()">Send OTP</button>'+
   '<div id="adminOtpWrap" style="display:none;margin-top:12px">'+
     '<input id="adminOtp" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="Enter OTP" style="width:100%;height:46px;border:1px solid #d8e2e4;border-radius:12px;padding:0 12px;font:inherit;text-align:center;letter-spacing:3px">'+
     '<button class="ok btn" onclick="verifyAdminOtp()">Verify & Open Admin</button>'+
   '</div>'+
   '<div id="adminLoginMsg" class="muted" style="margin-top:10px"></div>'+
 '</div>';
}
async function sendAdminOtp(){
 const email=String(document.getElementById('adminEmail')?.value||'').trim().toLowerCase();
 const msg=document.getElementById('adminLoginMsg');
 if(!email||!email.includes('@')){msg.textContent='Valid Admin email enter karein.';return}
 msg.textContent='Sending OTP...';
 try{
   const r=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:false}});
   if(r.error)throw r.error;
   adminOtpEmail=email;
   document.getElementById('adminOtpWrap').style.display='block';
   msg.textContent='OTP sent. Email check karein.';
 }catch(e){msg.textContent='OTP send failed: '+(e&&e.message?e.message:'Unknown error')}
}
async function verifyAdminOtp(){
 const token=String(document.getElementById('adminOtp')?.value||'').trim();
 const msg=document.getElementById('adminLoginMsg');
 if(!adminOtpEmail||!token){msg.textContent='Email aur OTP required.';return}
 msg.textContent='Verifying...';
 try{
   const r=await sb.auth.verifyOtp({email:adminOtpEmail,token,type:'email'});
   if(r.error)throw r.error;
   const access=await sb.rpc('admin_access_snapshot_v1');
   if(access.error)throw access.error;
   if(!access.data||!access.data.is_admin){
     await sb.auth.signOut();
     msg.textContent='Ye account Admin nahi hai.';
     return;
   }
   await loadQueue();
 }catch(e){msg.textContent='OTP verify failed: '+(e&&e.message?e.message:'Unknown error')}
}
async function loadQueue(){
 box.innerHTML='<div class="card">Loading Admin approval queue...</div>';
 try{
   const ses=await sb.auth.getSession();
   if(!(ses.data&&ses.data.session)){
     renderAdminLogin();
     return;
   }
   const access=await sb.rpc('admin_access_snapshot_v1');
   if(access.error)throw access.error;
   if(!access.data||!access.data.is_admin){
     box.innerHTML='<div class="card login"><h3>This account is not Admin</h3><div class="muted">Current login se SP approval allowed nahi hai. Admin account se login karein.</div><button class="ok btn" onclick="adminSignOut()">Switch to Admin Login</button></div>';
     return;
   }
   const q=await sb.rpc('admin_pending_provider_onboarding_v1');
   if(q.error)throw q.error;
   const rows=Array.isArray(q.data)?q.data:[];
   Object.keys(ocsAdminReviewChecked).forEach(id=>delete ocsAdminReviewChecked[id]);
   if(!rows.length){
     box.innerHTML='<div class="card empty"><div class="i">✓</div><h3>No pending SP approval</h3><div class="muted">Sab submitted providers reviewed hain.</div></div>';
     return;
   }
   box.innerHTML=rows.map((x,i)=>'<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><h3>'+esc(x.provider_name||'Service Provider')+'</h3><div class="muted">'+esc(x.phone||'')+'</div></div><span class="badge">PENDING</span></div><div class="row"><span>Category</span><b>'+esc(x.service_name||x.category||'Not set')+'</b></div><div class="row"><span>Service Area</span><b>'+esc(x.service_area||'Not set')+' • '+Number(x.service_radius_km||12)+' km</b></div><div class="row"><span>Bank</span><b>'+esc(x.bank_name||'Not added')+'</b></div><button class="btn" style="margin-top:12px" onclick="showSpVerification('+JSON.stringify(x.provider_id)+')">🔍 View Verification</button><div id="ocs-verification-'+esc(x.provider_id)+'"></div></div>').join('');
 }catch(e){
   box.innerHTML='<div class="error"><b>Admin page load failed.</b><br>'+esc(e&&e.message?e.message:'Unknown error')+'</div>';
 }
}
const ocsAdminReviewChecked={};
async function showSpVerification(id){
 const panel=document.getElementById('ocs-verification-'+id);
 if(!panel)return;
 ocsAdminReviewChecked[id]=false;
 panel.innerHTML='<div class="info">Loading verification...</div>';
 try{
  const response=await sb.rpc('admin_provider_verification_details_v1',{p_provider_id:id});
  if(response.error)throw response.error;
  const v=response.data||{};
  let selfieUrl='';
  if(v.selfie_uploaded&&v.selfie_path){
   const signed=await sb.storage.from('ocs-provider-private').createSignedUrl(v.selfie_path,120);
   if(signed.error)throw signed.error;
   selfieUrl=(signed.data&&signed.data.signedUrl)||'';
  }
  panel.innerHTML='<div class="card"><b>Private SP Verification</b>'+
   '<p class="muted">Admin-only selfie. Customer ko nahi dikhegi.</p>'+
   (selfieUrl?'<img id="verify-photo-'+esc(id)+'" src="'+esc(selfieUrl)+'" alt="Private SP selfie" style="width:100%;max-height:300px;object-fit:contain;background:#edf3f2;border-radius:12px;margin:12px 0">':'<div class="error">Selfie not available</div>')+
   '<div class="row"><span>Work Category</span><b>'+esc(v.categories||'Missing')+'</b></div>'+
   '<div class="row"><span>Location Saved</span><b>'+(v.location_saved?'Yes':'No')+'</b></div>'+
   '<div class="row"><span>Selfie Uploaded</span><b>'+(v.selfie_uploaded?'Yes':'No')+'</b></div>'+
   '<div class="row"><span>Single Category</span><b>'+(Number(v.category_count)===1?'Yes':'No')+'</b></div>'+
   '<div class="row"><span>Service Area</span><b>'+esc(v.service_area||'Not set')+' • '+esc(v.service_radius_km||'')+' km</b></div>'+
   '<div class="row"><span>Payout Bank</span><b>'+esc(v.bank_status||'Not added')+' (optional)</b></div>'+
   '<p class="muted" style="margin:12px 0">GPS saved does not prove identity. Admin must check the photo and profile manually.</p>'+
   (v.ready_for_admin_review&&selfieUrl?'<label style="display:flex;gap:9px;align-items:flex-start;font-size:12px;margin:12px 0"><input id="verify-check-'+esc(id)+'" type="checkbox" disabled onchange="confirmSpVerification('+JSON.stringify(id)+',this.checked)">I checked the selfie and SP details.</label>':'<div class="error">Approval blocked: verification incomplete.</div>')+
   '<div class="actions"><button id="approve-'+esc(id)+'" class="ok" disabled onclick="review('+JSON.stringify(id)+',\'approved\')">Approve SP</button><button class="red" onclick="review('+JSON.stringify(id)+',\'rejected\')">Reject / Correction</button></div>'+
   '</div>';
  const img=document.getElementById('verify-photo-'+id);
  if(img){
   const checkPhoto=()=>{
    const tick=document.getElementById('verify-check-'+id);
    if(tick)tick.disabled=!(img.complete&&img.naturalWidth>0);
   };
   img.addEventListener('load',checkPhoto);
   img.addEventListener('error',()=>{
    ocsAdminReviewChecked[id]=false;
    const btn=document.getElementById('approve-'+id);
    if(btn)btn.disabled=true;
    const tick=document.getElementById('verify-check-'+id);
    if(tick){tick.disabled=true;tick.checked=false}
    img.alt='Unable to load private selfie. Retry verification.';
   });
   if(img.complete)checkPhoto();
  }
 }catch(e){panel.innerHTML='<div class="error">'+esc(e.message||'Verification error')+'</div>'}
}
function confirmSpVerification(id,checked){
 ocsAdminReviewChecked[id]=checked===true;
 const btn=document.getElementById('approve-'+id);
 if(btn)btn.disabled=!ocsAdminReviewChecked[id];
}
async function review(id,decision){
 if(decision==='approved'&&!ocsAdminReviewChecked[id]){
   alert('Pehle View Verification mein photo aur details check karein.');
   return;
 }
 if(!confirm(decision==='approved'?'Verify karke SP approve karna hai?':'Reject / correction karna hai?'))return;
 let reason=null;
 if(decision==='rejected'){
   reason=(prompt('Correction / rejection reason (required)')||'').trim();
   if(!reason){alert('Reason zaruri hai.');return}
 }
 try{
   const r=await sb.rpc('admin_review_provider_onboarding_v1',{p_provider_id:id,p_decision:decision,p_reason:reason});
   if(r.error)throw r.error;
   alert(decision==='approved'?'Service Provider approved.':'Service Provider rejected.');
   await loadQueue();
 }catch(e){alert('SP review failed: '+(e&&e.message?e.message:'Unknown error'))}
}
async function adminSignOut(){
 try{await sb.auth.signOut()}catch(e){}
 location.href='index.html?v=20261008-adminotp1&login=1';
}
loadQueue();
</script>
</body>
</html>
