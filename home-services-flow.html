try{
 const raw=localStorage.getItem(KEY);
 if(raw){
   const saved=JSON.parse(raw);
   if(saved&&saved.status==="DONE"){
     clearBookingStorage();
     S=fresh();
   }else if(saved&&activeStatuses.has(saved.status)){
     S=Object.assign(fresh(),saved);
   }
 }
}catch(e){}

 ensureBookingId();

}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function money(n){return "₹"+Number(n||0).toLocaleString("en-IN")}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function lineTotal(x){
  if(S.category==="Electrical"&&x.name==="Fan Fitting / Capacitor Change"&&Number(x.qty)===3)return 600;
  return Number(x.price||0)*Number(x.qty||1)
}
function cartTotal(){return (S.cart||[]).reduce((a,x)=>a+lineTotal(x),0)}
function addWorkLineTotal(x){return Number(x.price||0)*Number(x.qty||1)}
function addWorkTotal(){return (S.addWorkCart||[]).reduce((a,x)=>a+addWorkLineTotal(x),0)}
const ADMIN_KEY="ocsAdminRecordsV1";
function adminStore(){
 try{
   const x=JSON.parse(localStorage.getItem(ADMIN_KEY)||'{"bookings":[],"tickets":[]}');
   return {bookings:Array.isArray(x.bookings)?x.bookings:[],tickets:Array.isArray(x.tickets)?x.tickets:[]};
 }catch(e){return {bookings:[],tickets:[]}}
}
function saveAdminStore(x){try{localStorage.setItem(ADMIN_KEY,JSON.stringify(x))}catch(e){}}
function ensureBookingId(){
 if(!S.bookingId){
   S.bookingId="OCS-BK-"+String(Date.now()).slice(-8);
   S.bookingCreatedAt=new Date().toISOString();
 }
 return S.bookingId;
}
function syncBookingToAdmin(){
 if(!S.bookingId)return;
 const A=adminStore();
 const rec={
   bookingId:S.bookingId,createdAt:S.bookingCreatedAt||new Date().toISOString(),
   status:S.status,category:S.category||"",service:S.service||"",amount:Number(S.total||0),
   address:S.address||"",provider:S.provider||"",payment:S.paymentChoice||"",
   customerLat:S.customerLat,customerLng:S.customerLng
 };
 const i=A.bookings.findIndex(x=>x.bookingId===S.bookingId);
 if(i>=0)A.bookings[i]=Object.assign(A.bookings[i],rec);else A.bookings.push(rec);
 saveAdminStore(A);
}
function createSupportTicket(role,msg,callback){
 const ticket="OCS-TKT-"+String(Date.now()).slice(-8);
 const bookingId=ensureBookingId();
 const rec={ticket,bookingId,role,msg,callback:!!callback,status:"NEW",createdAt:Date.now()};
 S.supportTickets=S.supportTickets||[];
 S.supportTickets.push(rec);
 const A=adminStore();
 if(!A.tickets.some(x=>x.ticket===ticket))A.tickets.push(rec);
 saveAdminStore(A);
 syncBookingToAdmin();
 return ticket;
}
function syncCurrentTicketsToAdmin(){
 if(!S.bookingId&&!(S.supportTickets||[]).length)return;
 const A=adminStore();
 (S.supportTickets||[]).forEach(t=>{
   const rec=Object.assign({bookingId:S.bookingId||"UNLINKED",status:"NEW"},t);
   if(!A.tickets.some(x=>(x.ticket||x.id)===(rec.ticket||rec.id)))A.tickets.push(rec);
 });
 saveAdminStore(A);
 syncBookingToAdmin();
}

document.addEventListener("input",e=>{
 if(e.target.id==="address"){S.address=e.target.value;save()}
});
document.addEventListener("click",e=>{
 const tab=e.target.closest("[data-tab]");if(tab){setTab(tab.dataset.tab);return}
 const b=e.target.closest("[data-action]");if(!b)return;
 const a=b.dataset.action;
 if(a==="home"){location.href="index.html?v=20260923-flow254";return}
 if(a==="category"){S.category=b.dataset.cat;S.cart=[];S.status="SELECT_ITEM";save();render();return}
 if(a==="categories"){S.category="";S.cart=[];S.status="SELECT_SERVICE";save();render();return}
 if(a==="add"){const i=Number(b.dataset.i),it=services[S.category].items[i];S.cart.push({i,name:it.name,price:Number(it.price||0),qty:1});save();render();return}
 if(a==="qty"){const i=Number(b.dataset.i),x=S.cart.find(v=>v.i===i);if(!x)return;x.qty=Math.max(0,Number(x.qty||1)+Number(b.dataset.d||0));if(x.qty===0)S.cart=S.cart.filter(v=>v.i!==i);save();render();return}
 if(a==="continue"){if(!S.cart.length)return;S.service=S.cart.map(x=>x.name+" × "+x.qty).join(", ");S.total=cartTotal();S.status="BOOKING_DETAILS";save();render();return}
 if(a==="items"){S.status="SELECT_ITEM";save();render();return}
 if(a==="quote-item"){const i=Number(b.dataset.i),it=services[S.category].items[i];S.service=it.name;S.serviceType="quote";S.status="CUSTOM_REQUEST";save();render();return}
 if(a==="send-quote-request"){const d=document.getElementById("customDesc").value.trim();if(!d){alert("Work details likhiye.");return}S.quoteRequest={service:S.service,desc:d,time:document.getElementById("customTime").value};S.status="QUOTE_WAIT";hist("Customer sent Get Quote request");render();return}
 if(a==="send-quote"){const amt=Number(prompt("Quote amount ₹"));if(!amt||amt<=0)return;S.quote={desc:S.quoteRequest&&S.quoteRequest.desc||S.service,amount:amt};S.status="INITIAL_QUOTE";hist("Service Provider sent quote ₹"+amt);render();return}
 if(a==="accept-quote"){S.total=Number(S.quote.amount);S.service=(S.service||S.category)+" • Accepted Quote";S.status="BOOKING_DETAILS";hist("Customer accepted quote ₹"+S.total);render();return}
 if(a==="reject-quote"){S.status="CUSTOM_REQUEST";hist("Customer rejected quote");render();return}
 if(a==="pay-choice"){S.paymentChoice=b.dataset.v;save();render();return}
 if(a==="share-location"){
   if(!navigator.geolocation){S.locationError="GPS/location is not supported on this browser.";save();render();return}
   S.locationError="";
   navigator.geolocation.getCurrentPosition(
     pos=>{S.customerLat=pos.coords.latitude;S.customerLng=pos.coords.longitude;S.locationSharedAt=new Date().toISOString();hist("Customer shared GPS location with Service Provider");save();render()},
     err=>{S.locationError=err&&err.message?err.message:"Location permission denied / unavailable.";save();render()},
     {enableHighAccuracy:true,timeout:12000,maximumAge:30000}
   );
   return;
 }
 if(a==="open-directions"){
   if(S.customerLat==null||S.customerLng==null)return;

   return;
 }
 if(a==="find-provider"){const addr=document.getElementById("address").value.trim();if(!addr){alert("Address / Location fill karein.");return}S.address=addr;ensureBookingId();S.status="REQUESTED";hist("Customer created booking • "+S.bookingId+" • "+money(S.total));syncBookingToAdmin();save();render();return}

 if(a==="open-next-request"){S.nextRequestReady=true;save();render();return}

 if(a==="reached"){S.startOtp=String(Math.floor(1000+Math.random()*9000));S.status="REACHED";hist(S.provider+" reached • Start OTP generated");render();return}

 if(a==="add-work-continue"){if(!(S.addWorkCart||[]).length)return;const amt=addWorkTotal();const desc=S.addWorkCart.map(x=>x.name+" × "+x.qty).join(", ");S.addonNotice="";S.addonRequest={type:"LISTED",status:"PENDING_PROVIDER",desc,amount:amt,items:S.addWorkCart.map(x=>({name:x.name,qty:x.qty,price:x.price}))};hist("Customer sent listed Add Work request • "+desc+" • "+money(amt));S.addWorkMode=false;S.addWorkCart=[];S.addWorkQuoteItem=null;save();render();return}
