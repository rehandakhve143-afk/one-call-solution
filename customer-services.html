   if(error)throw error;
   const b=Array.isArray(data)?data[0]:data;
   const id=(b&&b.id)||"";
   const current={
     flowVersion:11,id,bookingId:id,status:"REQUESTED",state:"REQUESTED",
     category,service:selected.map(x=>x.name+" × "+x.qty).join(", "),total,base:total,
     paymentChoice:bookingPayment,updatedAt:Date.now()
   };
   localStorage.setItem("ocsCurrentBooking",JSON.stringify(current));
   renderBookingSuccess(id,total);
 }catch(e){
   console.error(e);
   alert("Booking create nahi hui: "+(e&&e.message?e.message:"Unknown error"));
   if(btn){btn.disabled=false;btn.textContent="Find Service Provider"}
 }
}
function renderBookingSuccess(id,total){
 document.getElementById("topTitle").textContent="Booking Requested";
 document.getElementById("search").style.display="none";
 document.getElementById("cart").classList.remove("show");
 document.getElementById("content").innerHTML=
   '<div class="success"><div class="tick">✓</div><h2>Request sent</h2><p>OCS nearby matching verified Service Providers check kar raha hai.</p>'+
   (id?'<div class="bid">#'+esc(String(id).replace(/[^a-z0-9]/ig,"").slice(0,8).toUpperCase())+'</div>':'')+
   '<div class="summary" style="text-align:left;margin-top:8px"><div class="sum-row"><span>Service</span><b>'+esc(category)+'</b></div><div class="sum-row"><span>Amount</span><b>'+money(total)+'</b></div><div class="sum-row"><span>Payment</span><b>'+esc(bookingPayment)+'</b></div></div>'+
   '<button class="primary" style="margin-top:12px" onclick="location.href=\'index.html?open=activity&v=20261008-catroute1\'">View Activity</button>'+
   '<button class="secondary" style="margin-top:8px" onclick="goHome()">Back to Home</button></div>';
 window.scrollTo(0,0);
}
function handoffQuote(i){
 let name="New Service Request";
 if(typeof i==="number"){const it=services[category].items[i];if(it)name=it.name}
 else if(typeof i==="string")name=i;
 const payload={mode:"quote",category:category||"Custom / Other",service:name,serviceType:"quote",selectedItems:[],base:0,total:0};
 localStorage.setItem("ocsCustomerServiceSelectionV1",JSON.stringify(payload));
 location.href="home-services.html?v=20261008-catroute1&tab=customer&handoff=1";
}
function filterList(q){
 q=String(q||"").trim().toLowerCase();
 const root=category?document.getElementById("svcList"):document.getElementById("catList");
 if(!root)return;
 [...root.children].forEach(el=>el.style.display=!q||String(el.dataset.search||"").includes(q)?"":"none");
}
if(qs.get("resume")==="1"){
  try{
    const x=JSON.parse(localStorage.getItem("ocsCustomerServiceSelectionV1")||"null");
    if(x&&x.category&&services[x.category]){
      category=x.category;selected=Array.isArray(x.selectedItems)?x.selectedItems:[];
      bookingPayment=x.paymentChoice||"ONLINE";bookingMaterial=x.materialReadiness||"";bookingPower=x.powerReadiness||"";
      continueBooking();
      setTimeout(()=>{
        const a=document.getElementById("bookingAddress"),m=document.getElementById("bookingMobile");
        if(a)a.value=x.address||"";if(m)m.value=x.customerMobile||"";
        setPay(bookingPayment);if(bookingMaterial)setMaterial(bookingMaterial);if(bookingPower)setPower(bookingPower);
      },0);
    }else renderCategories();
  }catch(e){renderCategories()}
}else if(initialCat)openCategory(initialCat);else renderCategories();
</script>
